name: Actualizar Calco

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calco
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Leer feeds y escribir la lista
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update.py
      - name: Guardar cambios
        run: |
          git config user.name "calco-bot"
          git config user.email "calco-bot@users.noreply.github.com"
          git add docs/links.js docs/status.json state/seen.json
          git diff --cached --quiet || git commit -m "Actualiza enlaces"
          git push
