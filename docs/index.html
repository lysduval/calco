<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calco</title>
<style>
/* Layout: una columna estrecha alineada a la izquierda. Dos titulares de la jornada arriba; debajo, la lista. */
:root{
  --bg:#ffffff;
  --text:#000000;
  --dim:#767676;
  --seen:#8a8a8a;
  --body:Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#000000; --text:#ffffff; --dim:#8c8c8c; --seen:#777777; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#000000; --text:#ffffff; --dim:#8c8c8c; --seen:#777777; color-scheme:dark; }
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--text); font-family:var(--body); font-size:16px; line-height:1.3}
main{max-width:600px; padding:20px 16px 48px}
h1{margin:0; font-size:28px; font-weight:700; letter-spacing:.02em}
.sub{margin:4px 0 0; color:var(--dim); font-size:13px}
ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:14px}
#tops{margin:22px 0 0; gap:16px}
#tops a{font-size:22px; font-weight:700; line-height:1.2}
nav{margin:22px 0; font-size:13px; line-height:1.9}
nav button{font:inherit; color:var(--dim); background:none; border:0; padding:0; margin-right:12px; cursor:pointer}
nav button[aria-pressed="true"]{color:var(--text); text-decoration:underline}
li a{color:var(--text); text-decoration:none; overflow-wrap:anywhere}
li a:hover{text-decoration:underline}
li a:visited{color:var(--seen)}
li small{display:block; color:var(--dim); font-size:12px; margin-top:2px}
a:focus-visible, button:focus-visible{outline:2px solid var(--text); outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>CALCO</h1>
  <p class="sub" id="sub"></p>
  <ul id="tops"></ul>
  <nav id="nav" aria-label="Filtrar"></nav>
  <ul id="wall"></ul>
</main>
<script src="links.js"></script>
<script>
const TAGS = [["all","todo"],["es","españa"],["latam","américa latina"],["europa","europa"],["eeuu","eeuu"],["arte","arte"],["moda","moda"],["letras","letras"],["ideas","ideas"],["tech","tech"]];
const DATA = window.CALCO || {tops: [], links: []};
let tag = "all";
try { const t = localStorage.getItem("calco-tag"); if (t && TAGS.some(x => x[0] === t)) tag = t; } catch (e) {}

// "a las 13:05 del 12/11/2026", en hora de Madrid. Una fecha sin hora se muestra sola.
function when(d){
  if (!d) return "";
  if (d.length <= 10) { const p = d.split("-"); return "el " + p[2] + "/" + p[1] + "/" + p[0]; }
  const date = new Date(d);
  const opt = {timeZone: "Europe/Madrid"};
  const time = date.toLocaleTimeString("es-ES", Object.assign({hour: "2-digit", minute: "2-digit"}, opt));
  const day = date.toLocaleDateString("es-ES", Object.assign({day: "2-digit", month: "2-digit", year: "numeric"}, opt));
  return "a las " + time + " del " + day;
}

function row(i){
  const li = document.createElement("li");
  const a = document.createElement("a");
  a.href = i.u; a.target = "_blank"; a.rel = "noopener"; a.lang = i.l; a.textContent = i.h;
  const s = document.createElement("small");
  s.textContent = i.s + " · " + when(i.d) + (i.g ? " · " + i.g : "");
  li.appendChild(a); li.appendChild(s);
  return li;
}

const nav = document.getElementById("nav");
TAGS.forEach(([val, label]) => {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = label; b.dataset.val = val;
  b.addEventListener("click", () => { tag = val; try { localStorage.setItem("calco-tag", val); } catch (e) {} render(); });
  nav.appendChild(b);
});

function render(){
  nav.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.val === tag)));
  const tops = document.getElementById("tops"), wall = document.getElementById("wall");
  tops.textContent = ""; wall.textContent = "";
  DATA.tops.forEach(i => tops.appendChild(row(i)));
  DATA.links.filter(i => tag === "all" || i.t.includes(tag)).forEach(i => wall.appendChild(row(i)));
  document.getElementById("sub").textContent = DATA.updated ? "Actualizado " + when(DATA.updated) : "";
}
render();
</script>
</body>
</html>
